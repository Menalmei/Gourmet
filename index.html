<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Açaiteria PRO</title>

<script src="https://cdn.jsdelivr.net/npm/qz-tray/qz-tray.js"></script>

<style>

/* GOOGLE FONT */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    margin:0;
    background:#f3f4f6;
    color:#111827;

    display:flex;
    align-items:flex-start;
    gap:15px;

    width:100%;
}

/* COLUNAS */
.coluna{

    flex:1;

    min-width:0;

}

/* CARD PRINCIPAL */
.caixa{
    background:white;
    padding:18px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);

    color:#111827;
}

/* TITULOS */
h2{

    font-size:28px;

    font-weight:700;

    margin-bottom:22px;

    color:white;

}

h3{

    font-size:18px;

    margin-bottom:12px;

    color:white;

}

/* LABELS */
label{

    font-size:15px;

}

/* GRID */
.grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;

    align-items:start;

    margin-top:15px;

}

/* BOXES */
.box{

    background:#111827;

    padding:16px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.06);

    transition:0.25s;

}

.box:hover{

    border-color:#7b2cbf;

    transform:translateY(-2px);

}

.box b{

    display:block;

    margin-bottom:12px;

    font-size:16px;

    color:white;

}

.box label{

    display:block;

    margin-bottom:10px;

    cursor:pointer;

    color:#d1d5db;

}

/* AÇÕES */
.acoes{

    margin-top:18px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

/* BOTÕES */
button{

    width:100%;

    padding:14px;


    border-radius:10px;

    cursor:pointer;

    transition:0.25s;

    font-weight:700;

    font-size:14px;

    letter-spacing: 0.3px;

}

/* HOVER */
button:hover{

    transform:translateY(-2px);

}

/* BOTÃO PRINCIPAL */
.btn{

    background:linear-gradient(
        135deg,
        #7b2cbf,
        #9d4edd
    );

    color:white;

    box-shadow:
        0 8px 20px rgba(123,44,191,0.35);

}

/* SECUNDÁRIO */
.btn-sec{
    background:#e5e7eb;
    color:#111827;
}

/* EXCLUIR */
.excluir{

    background:#dc2626;

    color:white;

}

/* LINHA */
hr{

    border:none;

    height:1px;

    background:rgba(255,255,255,0.08);

    margin:22px 0;

}

/* TOTAL */
#totalDia{

    color:#22c55e;

    font-weight:700;

    font-size:22px;

}

/* PEDIDOS */
/* PEDIDOS */
.pedido{

    border-radius:22px;

    margin-bottom:16px;

    overflow:hidden;

    transition:0.25s;

    border:1px solid rgba(255,255,255,0.05);

    background:#7e3e3e;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

}

.recebido{

    border-left:6px solid #facc15;

}

.preparo{

    border-left:6px solid #fb923c;

}

.entrega{

    border-left:6px solid #60a5fa;

}

.finalizado{

    border-left:6px solid #22c55e;

}

.pedido:hover{

    transform:translateY(-3px);

    box-shadow:
        0 12px 30px rgba(0,0,0,0.35);

}

/* HEADER */
.header{

    font-weight:600;

    cursor:pointer;

    padding:18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    user-select:none;

    transition:0.2s;

    font-size:15px;

    color:white;

}

.header:hover{

    background:rgba(255,255,255,0.03);

}

.header:hover{
    background:rgba(0,0,0,0.04);
}

/* SETA */
.seta{
    transition:transform 0.3s ease;
    font-size:14px;
}

.seta.aberta{
    transform:rotate(90deg);
}

/* DETALHES */
.detalhe{
    padding:0 12px;
    max-height:0;
    overflow:hidden;
    opacity:0;

    transition:
        max-height 0.35s ease,
        opacity 0.25s ease,
        padding 0.25s ease;
}

.detalhe.aberto{

    padding:18px;

    max-height:700px;

    opacity:1;

    color:#e5e7eb;

}

/* STATUS */
.status-ok{
    opacity:0.7;
    font-weight:bold;
    margin-top:5px;
}

/* ANIMAÇÃO NOVO PEDIDO */
.novo{
    animation:novoPedido 1s ease;
}

@keyframes novoPedido{

    0%{
        transform:scale(0.95);
        opacity:0;
    }

    60%{
        transform:scale(1.02);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

*{
    box-sizing:border-box;
}

/* ========================= */
/* RESPONSIVIDADE MOBILE */
/* ========================= */

@media (max-width: 900px){

    body{
        flex-direction:column;
        gap:0;
    }

    .coluna{
        width:100%;
        padding:10px;
    }

    .grid{
        grid-template-columns:1fr;

    .header{

/* PAINEL FLUTUANTE PEDIDOS */

.cat-body label{

/* TEXTOS */

h1,h2,h3,h4,b,label,span,div{

</style>

<script>

let pedidos =
    JSON.parse(localStorage.getItem("pedidos"))
    || [];

let contador =
    pedidos.length + 1;

/* SALVAR */
function salvar(){

    localStorage.setItem(
        "pedidos",
        JSON.stringify(pedidos)
    );

}

function tempoDecorrido(pedido){

    if(!pedido.data) return "00:00";

    // PARA O TEMPO
    if(
        pedido.status === "entrega" ||
        pedido.status === "finalizado"
    ){

        if(pedido.tempoFinal){

            return pedido.tempoFinal;

        }

    }

    let agora = new Date();

    let criado =
        new Date(pedido.data);

    let diff =
        Math.floor(
            (agora - criado) / 1000
        );

    let minutos =
        Math.floor(diff / 60);

    let segundos =
        diff % 60;

    return `${String(minutos).padStart(2,"0")}:${String(segundos).padStart(2,"0")}`;

}

/* LIMPAR */
function novoPedido(){

    document.getElementById("cliente").value = "";

    document.querySelectorAll(
        "input[type=checkbox]"
    ).forEach(c => c.checked = false);

    document.querySelectorAll(
        'input[name="suco"]'
    ).forEach(r => r.checked = false);

    document.querySelector(
        'input[name="suco"][value=""]'
    ).checked = true;

}

/* SOM */
function tocarSom(){

    let som =
        document.getElementById("som");

    som.pause();
    som.currentTime = 0;

    som.play().catch(()=>{});

}

/* LIBERA SOM */
document.addEventListener("click", () => {

    let som =
        document.getElementById("som");

    som.play()
    .then(() => {

        som.pause();
        som.currentTime = 0;

    })
    .catch(()=>{});

}, { once:true });

/* QZ */
async function conectarQZ(){

    if(!qz.websocket.isActive()){

        await qz.websocket.connect();

    }

}

/* IMPRIMIR */
async function imprimir(p){

    await conectarQZ();

    let texto =

        "\x1B\x61\x01" +

        "MENALMEI GOURMET\n" +

        "==============================\n" +

        "\x1B\x21\x30" +

        "PEDIDO #" + p.numero + "\n" +

        "\x1B\x21\x00" +

        "==============================\n\n" +

        "\x1B\x61\x00" +

        "Cliente: " + p.cliente + "\n" +

        "Data: " +
        new Date().toLocaleString() +
        "\n\n" +

        p.itens + "\n" +

        "------------------------------\n" +

        "TOTAL: R$ " +
        p.total.toFixed(2) +
        "\n\n" +

        "Status: " + p.status + "\n\n" +

        "Obrigado pela preferência!\n\n\n";

    let printer =
        await qz.printers.getDefault();

    let config =
        qz.configs.create(printer);

    await qz.print(config,[{
        type:'raw',
        format:'plain',
        data:texto + '\x1D\x56\x00'
    }]);

}

/* REIMPRIMIR */
function imprimirPedido(numero){

    let pedido =
        pedidos.find(
            p => p.numero === numero
        );

    if(pedido){

        imprimir(pedido);

    }

}

/* CRIAR PEDIDO */
function criarPedido(){

    let cliente =
        document.getElementById("cliente").value;

    let itensTxt = "";
    let total = 0;

    let sucoSel =
        document.querySelector(
            'input[name="suco"]:checked'
        );

    if(
        sucoSel &&
        sucoSel.value !== ""
    ){

        let [nome,preco] =
            sucoSel.value.split("|");

        itensTxt +=
            "SUCO: " + nome + "\n";

        total += parseFloat(preco);

    }else{

        let [tam,preco] =
            document.querySelector(
                'input[name="tamanho"]:checked'
            ).value.split("|");

        itensTxt +=
            "Açaí " + tam + "\n";

        total += parseFloat(preco);

        document.querySelectorAll(
            "input[type=checkbox]:checked"
        ).forEach(c => {

            if(c.value.includes("|")){

                let [nome,valor] =
                    c.value.split("|");

                itensTxt +=
                    "- " + nome + "\n";

                total +=
                    parseFloat(valor);

            }else{

                itensTxt +=
                    "- " + c.value + "\n";

            }

        });

    }

    let pedido = {

    numero:contador++,
    cliente,
    itens:itensTxt,
    total,

    data:new Date(),

    status:"recebido"

};

    pedidos.push(pedido);

    salvar();

    atualizarTela();

    imprimir(pedido);

    tocarSom();

    novoPedido();

}

/* ATUALIZAR */
/* ATUALIZAR */
function atualizarTela(){

    let preparoHTML = "";
    let prontoHTML = "";
    let totalDia = 0;

    let ultimoPedido =
        pedidos.length
        ? pedidos[pedidos.length - 1].numero
        : null;

    pedidos.forEach(p => {

        totalDia += p.total;

        // abre apenas o último pedido que NÃO foi finalizado
        let aberto = "";

        if (
            p.numero === ultimoPedido &&
            p.status !== "finalizado"
        ){
            aberto = "aberto";
        }

        // TEXTO DO STATUS
        let textoStatus = "";

        if(p.status === "recebido"){
            textoStatus = "🟡 Recebido";
        }
        else if(p.status === "preparo"){
            textoStatus = "🟠 Em preparo";
        }
        else if(p.status === "entrega"){
            textoStatus = "🔵 Saiu entrega";
        }
        else{
            textoStatus = "🟢 Finalizado";
        }

        // TEXTO DO BOTÃO
        let textoBotao = "";

        if(p.status === "recebido"){
            textoBotao = "🟠 Iniciar preparo";
        }
        else if(p.status === "preparo"){
            textoBotao = "🔵 Saiu entrega";
        }
        else if(p.status === "entrega"){
            textoBotao = "🟢 Finalizar";
        }

        let card = `
        <div class="pedido ${p.status} novo">

            <div class="header"
     onclick="togglePedido(${p.numero})">

    <div style="
        display:flex;
        flex-direction:column;
        gap:3px;
    ">

        <span style="
            font-weight:bold;
            font-size:15px;
        ">
            #${p.numero} - ${p.cliente}
        </span>

        <span style="

            <span id="tempo-header-${p.numero}">

            </span>

        </span>

    </div>

    <span id="seta-${p.numero}"
          class="seta ${aberto}">

        ▶

    </span>

</div>

            <div id="detalhe-${p.numero}"
                 class="detalhe ${aberto}">

                ${p.itens.replace(/\n/g,"<br>")}

                <br><br>

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                ">

                    <b>
                    💰 R$ ${p.total.toFixed(2)}
                    </b>

                    <div id="tempo-${p.numero}" style="
                        background:${
                            tempoDecorrido(p).split(':')[0] >= 20
                            ? '#dc3545'
                            : tempoDecorrido(p).split(':')[0] >= 10
                            ? '#ffc107'
                            : '#28a745'
                        };
                        color:white;
                        padding:4px 8px;
                        border-radius:20px;
                        font-size:12px;
                    ">

                        ⏱ ${tempoDecorrido(p)}

                    </div>

                </div>

                <br>

                <div style="
                    font-weight:bold;
                    margin-top:5px;
                ">

                    ${textoStatus}

                </div>

                <br><br>

                ${
                    p.status !== "finalizado"
                    ?
                    `
                    <button onclick="event.stopPropagation(); mudarStatus(${p.numero})">

                        ${textoBotao}

                    </button>
                    `
                    :
                    `
                    <div class="status-ok">
                        ✅ Pedido finalizado
                    </div>
                    `
                }

                <button onclick="event.stopPropagation(); imprimirPedido(${p.numero})">

                    🖨 Reimprimir Comanda

                </button>

                <button class="excluir"
                onclick="event.stopPropagation(); excluirPedido(${p.numero})">

                    🗑 Excluir Pedido

                </button>

            </div>

        </div>
        `;

        // separação das colunas
        if(
            p.status === "recebido" ||
            p.status === "preparo" ||
            p.status === "entrega"
        ){
            preparoHTML += card;
        }
        else{
            prontoHTML += card;
        }

    });

    document.getElementById("colPreparo").innerHTML = preparoHTML;

    document.getElementById("colPronto").innerHTML = prontoHTML;

    document.getElementById("totalDia").innerText =
        totalDia.toFixed(2);

}

function atualizarTempos(){

    pedidos.forEach(p => {

        let tempo =
            tempoDecorrido(p);

        let minutos =
            parseInt(
                tempo.split(":")[0]
            );

        let cor = "#28a745";

        if(minutos >= 20){

            cor = "#dc3545";

        }
        else if(minutos >= 10){

            cor = "#ffc107";

        }

        // TEMPO DO CARD ABERTO
        let tempoEl =
            document.getElementById(
                "tempo-" + p.numero
            );

        if(tempoEl){

            tempoEl.innerHTML =
                "⏱ " + tempo;

            tempoEl.style.background =
                cor;

        }

        // TEMPO DO HEADER
        let tempoHeader =
            document.getElementById(
                "tempo-header-" + p.numero
            );

        if(tempoHeader){

            tempoHeader.innerHTML =
                "⏱ " + tempo;

        }

    });

}

/* ABRIR / FECHAR */
function togglePedido(numero){

    let detalhe =
        document.getElementById(
            "detalhe-" + numero
        );

    let seta =
        document.getElementById(
            "seta-" + numero
        );

    if(!detalhe) return;

    detalhe.classList.toggle("aberto");

    if(seta){

        seta.classList.toggle("aberta");

    }

}

function toggleCategoria(id){

    let area =
        document.getElementById(id);

    let seta =
        document.getElementById(
            "seta-" + id
        );

    area.classList.toggle("aberto");

    seta.classList.toggle("aberta");

}

/* STATUS */
function mudarStatus(numero){

    let pedido =
        pedidos.find(
            p => p.numero === numero
        );

    if(!pedido) return;

    // RECEBIDO -> PREPARO
    if(pedido.status === "recebido"){

        pedido.status = "preparo";

    }

    // PREPARO -> ENTREGA
    else if(pedido.status === "preparo"){

        pedido.tempoFinal =
            tempoDecorrido(pedido);

        pedido.status = "entrega";

    }

    // ENTREGA -> FINALIZADO
    else if(pedido.status === "entrega"){

        pedido.status = "finalizado";

    }

    salvar();

    atualizarTela();

}

/* EXCLUIR */
function excluirPedido(numero){

    if(
        !confirm(
            "Deseja excluir este pedido?"
        )
    ) return;

    pedidos =
        pedidos.filter(
            p => p.numero !== numero
        );

    salvar();

    atualizarTela();

}

/* PAINEL PEDIDOS */
function togglePainelPedidos(){

    document
    .getElementById("painelPedidos")
    .classList.toggle("aberto");

    document
    .getElementById("overlayPedidos")
    .classList.toggle("ativo");

}

function fecharPainelPedidos(){

    document
    .getElementById("painelPedidos")
    .classList.remove("aberto");

    document
    .getElementById("overlayPedidos")
    .classList.remove("ativo");

}

/* INICIAR */
atualizarTela();

setInterval(() => {

    atualizarTempos();

}, 1000);

</script>
