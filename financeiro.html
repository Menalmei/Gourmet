<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Financeiro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#eef2f7;padding:25px;}

h1{font-size:32px;margin-bottom:20px;}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card h2{font-size:14px;color:#666;}
.valor{font-size:26px;font-weight:bold;color:#1b8d3d;margin-top:10px;}

.container{
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
}

.calendario,.detalhes{
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.mes{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;}
.mes button{background:#6c63ff;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;}

.diasSemana,.dias{
display:grid;
grid-template-columns:repeat(7,1fr);
text-align:center;
gap:6px;
}

.dia{
padding:12px;
background:#f5f5f5;
border-radius:10px;
cursor:pointer;
}

.dia:hover{background:#6c63ff;color:#fff;}
.hoje{background:#28a745;color:#fff;}
.selecionado{background:#ff9800!important;color:#fff;}

.totalDia{font-size:32px;font-weight:bold;color:#1b8d3d;margin:10px 0;}

canvas{margin-top:20px;}
</style>
</head>

<body>

<h1>📊 Dashboard Financeiro</h1>

<div class="dashboard">
<div class="card"><h2>Hoje</h2><div class="valor" id="fatHoje">R$ 0</div></div>
<div class="card"><h2>Mês</h2><div class="valor" id="fatMes">R$ 0</div></div>
<div class="card"><h2>Pedidos</h2><div class="valor" id="pedidosTotal">0</div></div>
<div class="card"><h2>Ticket Médio</h2><div class="valor" id="ticket">R$ 0</div></div>
</div>

<div class="container">

<div class="calendario">
<div class="mes">
<button id="voltar">◀</button>
<h2 id="mesAno"></h2>
<button id="avancar">▶</button>
</div>

<div class="diasSemana">
<div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
</div>

<div class="dias" id="dias"></div>
</div>

<div class="detalhes">
<h2 id="tituloData">Selecione um dia</h2>
<div class="totalDia" id="valorDia">R$ 0</div>

<canvas id="grafico"></canvas>
</div>

</div>

<script>

// =========================
// CONFIG
// =========================

const URL = "https://script.google.com/macros/s/AKfycbzQFNw249hOQplBAt4WzlGdaOev5E1KYgn2bRWhC2z-7eotL51OmToVydzAqQXzsilT/exec";

let pedidos = [];
let financeiro = {};

let hoje = new Date();
let mesAtual = hoje.getMonth();
let anoAtual = hoje.getFullYear();
let diaSelecionado = hoje.getDate();

const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const dias = document.getElementById("dias");
const mesAno = document.getElementById("mesAno");

// =========================
// HELPERS
// =========================

function pad(n){ return String(n).padStart(2,"0"); }

function key(a,m,d){
return `${a}-${pad(m)}-${pad(d)}`;
}

function parseData(str){
if(!str) return null;
if(str.includes("T")) return new Date(str);

let p = str.split(" ");
let d = p[0].split("/");

if(d.length === 3){
return new Date(`${d[2]}-${d[1]}-${d[0]} ${p[1]||""}`);
}

return new Date(str);
}

// =========================
// CSV
// =========================

async function loadData(){
  try{
    const res = await fetch(URL);
    const data = await res.json();

    // 🔥 AQUI está a diferença importante
    parseAPI(data.pedidos);

    render();

  }catch(e){
    console.log("erro API", e);
  }
}

function parseAPI(data){

pedidos = [];
financeiro = {};

for(let pedido of data){

if(!pedido.data) continue;

pedidos.push(pedido);

let d = parseData(pedido.data);
if(!d) continue;

let k = key(d.getFullYear(), d.getMonth()+1, d.getDate());

if(!financeiro[k]){
financeiro[k] = {
pix:0,
cartao:0,
dinheiro:0,
pedidos:0,
total:0
};
}

financeiro[k].total += Number(pedido.total) || 0;
financeiro[k].pedidos++;
financeiro[k].dinheiro += Number(pedido.total) || 0;

}
}

// =========================
// CALENDÁRIO
// =========================

function drawCalendar(){

dias.innerHTML="";
mesAno.innerHTML = `${meses[mesAtual]} ${anoAtual}`;

let first = new Date(anoAtual,mesAtual,1).getDay();
let last = new Date(anoAtual,mesAtual+1,0).getDate();

for(let i=0;i<first;i++){
dias.innerHTML += "<div></div>";
}

for(let d=1; d<=last; d++){

let div = document.createElement("div");
div.className = "dia";
div.textContent = d;

if(d===hoje.getDate() && mesAtual===hoje.getMonth()) div.classList.add("hoje");
if(d===diaSelecionado) div.classList.add("selecionado");

div.onclick = ()=>{
diaSelecionado = d;
drawCalendar();
render();
};

dias.appendChild(div);
}
}

// =========================
// RESUMO
// =========================

function render(){

let k = key(anoAtual, mesAtual+1, diaSelecionado);
let d = financeiro[k] || {pix:0,cartao:0,dinheiro:0,pedidos:0,total:0};

document.getElementById("tituloData").textContent =
`${pad(diaSelecionado)}/${pad(mesAtual+1)}/${anoAtual}`;

document.getElementById("valorDia").textContent =
d.total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

// mês
let totalMes = 0;
let pedidosMes = 0;

for(let k in financeiro){
let [a,m] = k.split("-");
if(Number(a)==anoAtual && Number(m)==pad(mesAtual+1)){
totalMes += financeiro[k].total;
pedidosMes += financeiro[k].pedidos;
}
}

document.getElementById("fatMes").textContent =
totalMes.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

document.getElementById("pedidosTotal").textContent = pedidosMes;

document.getElementById("ticket").textContent =
pedidosMes ? (totalMes/pedidosMes).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "R$ 0";

updateChart();
}

// =========================
// GRÁFICO
// =========================

let chart;

function updateChart(){

let labels = [];
let values = [];

for(let i=1;i<=31;i++){
let k = key(anoAtual,mesAtual+1,i);
labels.push(i);
values.push(financeiro[k]?.total || 0);
}

if(chart) chart.destroy();

chart = new Chart(document.getElementById("grafico"),{
type:"bar",
data:{
labels,
datasets:[{
label:"Faturamento",
data:values
}]
}
});
}

// =========================
// NAV
// =========================

document.getElementById("voltar").onclick=()=>{
mesAtual--;
if(mesAtual<0){mesAtual=11;anoAtual--;}
drawCalendar();render();
};

document.getElementById("avancar").onclick=()=>{
mesAtual++;
if(mesAtual>11){mesAtual=0;anoAtual++;}
drawCalendar();render();
};

// =========================
// INIT
// =========================

drawCalendar();
loadData();

</script>

</body>
</html>
